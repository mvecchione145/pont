server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 2m;

  # File uploads: up to 50 MB per upload (the server enforces the limits).
  location /api/uploads {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 55m;
    proxy_read_timeout 300s;
  }

  # Chat answers stream as they are written; don't buffer them.
  location = /api/chat {
    proxy_pass http://server:4000/api/chat;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location /api/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # MCP endpoint for agents (Streamable HTTP). Responses may be SSE streams,
  # so don't buffer them.
  location = /mcp {
    proxy_pass http://server:4000/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  # Single-page app: unknown paths fall back to index.html.
  location / {
    try_files $uri /index.html;
  }
}
